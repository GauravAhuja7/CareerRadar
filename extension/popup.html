<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 16px;
      background: #fafafa;
      color: #09090b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #e4e4e7;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: -0.3px;
      color: #09090b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .status-badge {
      font-size: 10px;
      font-family: ui-monospace, monospace;
      padding: 2px 6px;
      border-radius: 4px;
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
      font-weight: 600;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e4e4e7;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .metric {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .metric:last-child { margin-bottom: 0; }
    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid #09090b;
      background: #09090b;
      color: #ffffff;
      transition: background 0.15s ease;
      text-align: center;
    }
    .btn:hover {
      background: #27272a;
    }
    .supported-platforms {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
    .chip {
      background: #f4f4f5;
      border: 1px solid #e4e4e7;
      color: #52525b;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, monospace;
      font-size: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>⬡</span>
      <span>CareerRadar</span>
    </div>
    <span class="status-badge">Jev Online</span>
  </div>

  <button id="btn-open-sidepanel" class="btn" style="margin-bottom:12px;">
    Open Side Panel Radar
  </button>

  <div class="card">
    <div class="metric">
      <span style="color:#71717a;">Engine:</span>
      <strong style="color:#09090b; font-family:ui-monospace, monospace;">TypeSafe Jev System One</strong>
    </div>
    <div class="metric">
      <span style="color:#71717a;">Primitives:</span>
      <strong style="color:#09090b; font-family:ui-monospace, monospace;">NOUL, CHOICE, SCORE</strong>
    </div>
    <div class="metric">
      <span style="color:#71717a;">Avg Latency:</span>
      <strong style="color:#16a34a; font-family:ui-monospace, monospace;">~280ms Speculative</strong>
    </div>
  </div>

  <div style="font-size: 10px; color:#71717a; font-family:ui-monospace, monospace; text-transform:uppercase; margin-bottom:2px;">
    Supported Radar Feeds:
  </div>
  <div class="supported-platforms">
    <span class="chip">LinkedIn</span>
    <span class="chip">Indeed</span>
    <span class="chip">Wellfound</span>
    <span class="chip">YC Startup</span>
    <span class="chip">Greenhouse</span>
    <span class="chip">Lever</span>
    <span class="chip">Ashby</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
